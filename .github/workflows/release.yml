name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: pytest tests

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm SlideClean_build.spec

      - name: Package artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zip = "SlideClean_Windows_x64_$version.zip"
          Compress-Archive -Path dist/SlideClean.exe -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlideClean_Windows_x64
          path: SlideClean_Windows_x64_*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SlideClean_Windows_x64_*.zip
          generate_release_notes: true
